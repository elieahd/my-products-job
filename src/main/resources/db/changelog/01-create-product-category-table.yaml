databaseChangeLog:
  - changeSet:
      id: 01-create-product-category-table
      author: elieahd
      changes:
        - createTable:
            tableName: product_category
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_product_category
                    nullable: false
              - column:
                  name: code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_product_category_code
              - column:
                  name: description
                  type: VARCHAR(255)
      rollback:
        - dropTable:
            tableName: product_category